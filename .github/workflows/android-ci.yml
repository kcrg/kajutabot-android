name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android API 37
        run: sdkmanager 'platforms;android-37'
      - name: Test, lint and build unsigned release
        run: bash ./gradlew --no-daemon :api:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
